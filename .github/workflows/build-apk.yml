name: Build APK

on:
  push:
    branches: [main]
    paths: ["android/**", "rules/**", ".github/workflows/build-apk.yml"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
      - name: Decode signing key
        run: echo "${{ secrets.PHONESAAR_KEYSTORE_BASE64 }}" | base64 --decode > "$RUNNER_TEMP/phonesaar.keystore"
      - name: Build release APK
        env:
          PHONESAAR_KEYSTORE: ${{ runner.temp }}/phonesaar.keystore
          PHONESAAR_KEYSTORE_PASSWORD: ${{ secrets.PHONESAAR_KEYSTORE_PASSWORD }}
          PHONESAAR_KEY_ALIAS: ${{ secrets.PHONESAAR_KEY_ALIAS }}
        run: ./gradlew assembleRelease --no-daemon
      - name: Check the APK before publishing
        run: |
          BT="$ANDROID_HOME/build-tools/$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -1)"
          APK=app/build/outputs/apk/release/app-release.apk
          "$BT/apksigner" verify -v "$APK" | tee /tmp/sig.txt
          grep -q "v1 scheme (JAR signing): true" /tmp/sig.txt
          grep -q "v2 scheme (APK Signature Scheme v2): true" /tmp/sig.txt
          "$BT/zipalign" -c -P 16 4 "$APK"
          "$BT/aapt2" dump badging "$APK" | head -3
      - name: Name the APK
        run: |
          cp app/build/outputs/apk/release/app-release.apk ../phonesaar.apk
          cp ../phonesaar.apk ../phonesaar-1.0.${{ github.run_number }}.apk
          cd .. && sha256sum phonesaar.apk | cut -d' ' -f1 > phonesaar.apk.sha256
          printf '{"versionCode":%s,"versionName":"1.0.%s","bytes":%s,"sha256":"%s"}\n' "${{ github.run_number }}" "${{ github.run_number }}" "$(stat -c %s phonesaar.apk)" "$(cat phonesaar.apk.sha256)" > version.json
      # The release is updated in place, never deleted, so the download link never 404s mid-build.
      - name: Publish to the "latest" release
        working-directory: .
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view latest >/dev/null 2>&1 || gh release create latest --title "PhoneSaar" --notes "Latest build"
          gh release upload latest phonesaar.apk phonesaar-1.0.${{ github.run_number }}.apk phonesaar.apk.sha256 version.json --clobber
          gh release edit latest --title "PhoneSaar 1.0.${{ github.run_number }}" --notes "Built from ${{ github.sha }}. Download phonesaar.apk and open it. Installs over earlier builds; the signing key is the same."
