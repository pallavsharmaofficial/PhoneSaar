name: Build APK

on:
  push:
    branches: [main]
    paths: ["android/**", "rules/**", ".github/workflows/build-apk.yml"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
      - name: Decode signing key
        run: echo "${{ secrets.PHONESAAR_KEYSTORE_BASE64 }}" | base64 --decode > "$RUNNER_TEMP/phonesaar.keystore"
      - name: Build release APK
        env:
          PHONESAAR_KEYSTORE: ${{ runner.temp }}/phonesaar.keystore
          PHONESAAR_KEYSTORE_PASSWORD: ${{ secrets.PHONESAAR_KEYSTORE_PASSWORD }}
          PHONESAAR_KEY_ALIAS: ${{ secrets.PHONESAAR_KEY_ALIAS }}
        run: ./gradlew assembleRelease --no-daemon
      - name: Name the APK
        run: cp app/build/outputs/apk/release/app-release.apk ../phonesaar.apk
      - name: Publish to the "latest" release
        working-directory: .
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest phonesaar.apk \
            --title "PhoneSaar build ${{ github.run_number }}" \
            --notes "Built from ${{ github.sha }}. Install over the previous build; the signing key is the same."
